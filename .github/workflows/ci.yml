name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  python:
    name: python (desktop app)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    env:
      # The Qt tests run headless on the CI runner.
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            python/requirements.txt
            python/requirements-dev.txt

      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3

      - name: Install
        run: pip install -r requirements-dev.txt

      - name: Tests
        run: python -m pytest -q

  web:
    name: web (server + client)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # node:sqlite (DatabaseSync) is used by the local/test database adapter.
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck (server + client)
        run: npm run typecheck

      - name: Unit + integration tests
        run: npm test

      - name: HTTP smoke test (throwaway local database)
        run: npm run smoke

      - name: Production build of the client
        run: npm -w @bop-erp/client run build

  ui-audit:
    name: web (browser UI audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: UI audit (boots the API + Vite dev server itself)
        run: npm run test:e2e

      - name: Keep the page screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-audit-screenshots
          path: web/e2e/.artifacts
          if-no-files-found: ignore
