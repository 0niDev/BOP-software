name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  web:
    name: web (server + client)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # node:sqlite (DatabaseSync) is used by the local/test database adapter.
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck (server + client)
        run: npm run typecheck

      - name: Unit + integration tests
        run: npm test

      - name: HTTP smoke test (throwaway local database)
        run: npm run smoke

      - name: Production build of the client
        run: npm -w @bop-erp/client run build
