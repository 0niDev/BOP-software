[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -ra --tb=short
markers =
    gui: GUI/Qt widget tests (require offscreen QApplication)
    cloud: tests that hit the live SQLite Cloud database
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning